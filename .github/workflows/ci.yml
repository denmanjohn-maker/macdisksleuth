name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: Build & test (Swift package)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  intel:
    name: Build & test (Intel x86_64)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Intel hardware.
          - os: macos-15-intel
            arch: x86_64
          # x86_64 slice on Apple Silicon under Rosetta 2 — the same code path
          # the universal release binary takes on an Intel Mac.
          - os: macos-15
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Rosetta
        if: matrix.os == 'macos-15'
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build
        run: swift build --arch ${{ matrix.arch }}
      - name: Test
        run: swift test --arch ${{ matrix.arch }}

  app:
    name: Build app
    # macos-15 is the Release workflow's runner; building there too catches
    # SDK-specific strict-concurrency errors before a tag does.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec App/project.yml --project App
      - name: Build
        run: |
          xcodebuild -project App/MacDiskSleuth.xcodeproj -scheme MacDiskSleuth -configuration Release \
            -derivedDataPath build ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build CODE_SIGNING_ALLOWED=NO
      - name: Check universal binary and macOS 13 minimum
        run: scripts/check-binary.sh build/Build/Products/Release/MacDiskSleuth.app/Contents/MacOS/MacDiskSleuth
