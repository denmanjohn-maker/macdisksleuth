name: Release

# Push a tag like v0.1.0 to publish a release. See RELEASING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match the tag
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Test
        run: swift test

      - name: Build universal CLI
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Build app
        run: |
          brew install xcodegen
          xcodegen generate --spec App/project.yml --project App
          xcodebuild -project App/DiskSleuth.xcodeproj -scheme DiskSleuth \
            -configuration Release -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- build

      - name: Package
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir dist
          cli=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/disksleuth
          lipo -info "$cli"
          tar -czf "dist/disksleuth-$v-macos-universal.tar.gz" -C "$(dirname "$cli")" disksleuth
          ditto -c -k --keepParent build/Build/Products/Release/DiskSleuth.app "dist/DiskSleuth-$v.zip"
          (cd dist && shasum -a 256 * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease);; esac
          cat > notes.md <<'NOTES'
          > **Not notarized.** The app is ad-hoc signed. After unzipping, right-click → Open the first time, or run `xattr -dr com.apple.quarantine DiskSleuth.app`. The CLI tarball likewise: `xattr -d com.apple.quarantine disksleuth`.
          > Requires macOS 14+. Verify downloads against `SHA256SUMS`.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "DiskSleuth ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md "${flags[@]}"
