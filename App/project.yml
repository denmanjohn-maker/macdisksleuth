name: MacDiskSleuth
options:
  bundleIdPrefix: com.jdenman
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  macdisksleuth:
    path: ..
targets:
  MacDiskSleuth:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: macdisksleuth
        product: MacDiskSleuthKit
    # Generated by XcodeGen and merged with GENERATE_INFOPLIST_FILE keys.
    info:
      path: MacDiskSleuth-Info.plist
      properties:
        # Finder Quick Action / Services menu: "Analyze with MacDiskSleuth".
        NSServices:
          - NSMenuItem:
              default: Analyze with MacDiskSleuth
            NSMessage: analyzeFolder
            NSPortName: MacDiskSleuth
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.folder
              - public.volume
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jdenman.macdisksleuth
        PRODUCT_NAME: MacDiskSleuth
        MARKETING_VERSION: "0.1.0-rc6"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License — github.com/denmanjohn-maker/macdisksleuth"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        Release:
          # Plain `xcodebuild build` injects com.apple.security.get-task-allow so
          # a debugger can attach; Apple's notary service rejects binaries that
          # carry it. Debug keeps the default so Xcode can still debug the app.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
